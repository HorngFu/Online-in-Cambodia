name: 💡 Suggest a feature
description: An idea to make the website more useful.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who has this problem, and when?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
